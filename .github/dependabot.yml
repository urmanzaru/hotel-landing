# Actualizaciones semanales y agrupadas (playbook 07). Cada PR pasa por CI antes de poder fusionarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    # Las versiones nuevas esperan dos semanas antes de proponerse (cadena de suministro).
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ['*']
    cooldown:
      default-days: 14
